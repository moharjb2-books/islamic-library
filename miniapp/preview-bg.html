<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>معاينة الخلفية المتحركة</title>
<style>
:root {
  --brand: #1d2a4d; --brand-dark: #131d38; --accent: #c9a227; --gold: var(--accent);
  --cream: #f4eee1; --card: #fffdf7; --ink: #2b2620; --muted: #8a7f6f; --line: #e8e0cd;
  --bg-tint: #eee4cb;
  --glow-1: rgba(201, 162, 39, .16);
  --glow-2: rgba(29, 42, 77, .10);
  --glow-3: rgba(201, 162, 39, .09);
}
/* palette 2: ليلي (navy dark) */
html[data-p="2"] {
  --cream: #141d36; --bg-tint: #0f1628; --card: #1e2a4a; --ink: #f0ead8; --muted: #9aa4c0; --line: #2c3a5e;
  --glow-1: rgba(201, 162, 39, .20);
  --glow-2: rgba(90, 120, 200, .16);
  --glow-3: rgba(201, 162, 39, .12);
}
/* palette 3: زمردي (emerald + gold) */
html[data-p="3"] {
  --brand: #14532d; --brand-dark: #0d3b20; --cream: #eef3ea; --bg-tint: #dfe9d8;
  --glow-1: rgba(201, 162, 39, .15);
  --glow-2: rgba(20, 83, 45, .12);
  --glow-3: rgba(201, 162, 39, .09);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100vw; }
html { background: var(--cream); }
body { font-family: system-ui, sans-serif; background: transparent; color: var(--ink); min-height: 100vh; padding-bottom: 30px; }

.bgfx { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background: linear-gradient(180deg, var(--cream) 0%, var(--bg-tint) 100%); }
.bgfx i { position: absolute; border-radius: 50%; will-change: transform; }
.bgfx i:nth-child(1) { width: 340px; height: 340px; top: -90px; inset-inline-start: -100px;
  background: radial-gradient(circle, var(--glow-1) 0%, transparent 70%);
  animation: bgfx-a 36s ease-in-out infinite alternate; }
.bgfx i:nth-child(2) { width: 300px; height: 300px; top: 34%; inset-inline-end: -110px;
  background: radial-gradient(circle, var(--glow-2) 0%, transparent 70%);
  animation: bgfx-b 44s ease-in-out infinite alternate; }
.bgfx i:nth-child(3) { width: 260px; height: 260px; bottom: -70px; inset-inline-start: 12%;
  background: radial-gradient(circle, var(--glow-3) 0%, transparent 70%);
  animation: bgfx-c 52s ease-in-out infinite alternate; }
@keyframes bgfx-a { from { transform: translate(0, 0) scale(1); } to { transform: translate(42px, 34px) scale(1.14); } }
@keyframes bgfx-b { from { transform: translate(0, 0) scale(1.08); } to { transform: translate(-38px, -30px) scale(1); } }
@keyframes bgfx-c { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -26px) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .bgfx i { animation: none; } }

.hero { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
  border-radius: 0 0 28px 28px; padding: 18px 20px 58px; color: #fff; }
.hero h1 { font-size: 26px; margin-top: 10px; }
.hero .sub { font-size: 13.5px; opacity: .85; margin-top: 6px; }
.searchbar { display: flex; gap: 8px; align-items: center; background: var(--card);
  border-radius: 18px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(60, 20, 20, .18);
  margin: -34px 16px 0; position: relative; color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  margin: 12px 14px; padding: 14px 16px; }
.card h3 { font-size: 15.5px; margin-bottom: 6px; }
.card p { font-size: 12.5px; color: var(--muted); }
.switcher { position: fixed; bottom: 12px; inset-inline: 12px; display: flex; gap: 8px; z-index: 5; }
.switcher a { flex: 1; text-align: center; padding: 10px; border-radius: 12px; font-size: 13px;
  text-decoration: none; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.switcher a.on { border-color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="hero"><div>مكتبة الكتب</div><h1>المكتبة الإسلامية الشاملة</h1><div class="sub">ابحث في آلاف الكتب والرسائل</div></div>
<div class="searchbar">🔍 ابحث عن كتاب أو مؤلف…</div>
<div class="card"><h3>شرح ثلاثة الأصول</h3><p>محمد بن عبد الوهاب · PDF · 2.4 MB</p></div>
<div class="card"><h3>تفسير ابن كثير</h3><p>ابن كثير · PDF · 18 MB</p></div>
<div class="card"><h3>رياض الصالحين</h3><p>النووي · MP3 · 95 MB</p></div>
<div class="switcher">
  <a href="?p=1" id="s1">كحلي وذهبي</a><a href="?p=2" id="s2">ليلي</a><a href="?p=3" id="s3">زمردي</a>
</div>
<script>
const p = new URLSearchParams(location.search).get('p') || '1';
document.documentElement.dataset.p = p;
document.getElementById('s' + p).classList.add('on');
</script>
</body>
</html>
