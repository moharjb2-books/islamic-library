<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المكتبة الإسلامية الشاملة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face { font-family: 'Thmanyah Serif'; src: url('fonts/ThmanyahSerifDisplay-Bold.otf') format('opentype'); font-weight: 700; }
@font-face { font-family: 'Thmanyah Serif'; src: url('fonts/ThmanyahSerifDisplay-Regular.otf') format('opentype'); font-weight: 400; }
@font-face { font-family: 'Thmanyah Sans'; src: url('fonts/ThmanyahSans-Regular.otf') format('opentype'); font-weight: 400; }
@font-face { font-family: 'Thmanyah Sans'; src: url('fonts/ThmanyahSans-Medium.otf') format('opentype'); font-weight: 500; }
@font-face { font-family: 'Thmanyah Sans'; src: url('fonts/ThmanyahSans-Bold.otf') format('opentype'); font-weight: 700; }

:root {
  /* ===== THEME: swap these six values to restyle the whole app =====
     Approved default: deep red + gold on cream. Alt candidate: navy + gold. */
  --brand: #1d2a4d;
  --brand-dark: #131d38;
  --accent: #c9a227;
  --gold: var(--accent);
  --tag-bg: #f0ead2;
  --tag-ink: #8a6b1f;
  /* =============================================================== */
  --cream: #f4eee1;
  --card: #fffdf7;
  --ink: #2b2620;
  --muted: #8a7f6f;
  --line: #e8e0cd;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; max-width: 100vw; }
body {
  font-family: 'Thmanyah Sans', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 76px;
}
h1, h2, h3, .serif { font-family: 'Thmanyah Serif', serif; }

/* ---------- header ---------- */
.hero {
  background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
  border-radius: 0 0 28px 28px;
  padding: 18px 20px 58px;
  color: #fff;
  position: relative;
}
.hero .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; opacity: .9; }
.hero h1 { font-size: 26px; margin-top: 10px; font-weight: 700; }
.hero .sub { font-size: 13.5px; opacity: .85; margin-top: 6px; }

.searchbar {
  display: flex; gap: 8px; align-items: center;
  background: var(--card);
  border-radius: 18px;
  padding: 4px 6px 4px 16px;
  box-shadow: 0 8px 24px rgba(60, 20, 20, .18);
  margin: -34px 16px 0;
  position: relative; z-index: 5;
}
.searchbar input {
  flex: 1; border: 0; outline: 0; background: transparent;
  font-family: inherit; font-size: 16px; padding: 12px 0; color: var(--ink);
}
.searchbar input::placeholder { color: var(--muted); }
.searchbar .go {
  background: var(--brand); color: #fff; border: 0; border-radius: 13px;
  min-width: 74px; padding: 0 20px; height: 46px; font-size: 17px; font-weight: 700;
  font-family: inherit; cursor: pointer; flex: 0 0 auto;
}

/* ---------- chips ---------- */
.chips { display: flex; gap: 8px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 7px 16px; font-size: 13.5px; font-weight: 500;
  cursor: pointer; white-space: nowrap; font-family: inherit;
}
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---------- sections ---------- */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 18px 10px; }
.sec-head h2 { font-size: 19px; color: var(--brand); }
.sec-head .more { font-size: 12.5px; color: var(--muted); }

.list { padding: 0 14px; display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 16px; display: flex; gap: 14px; align-items: flex-start;
}
.letter {
  width: 58px; height: 74px; border-radius: 10px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 30px; font-family: 'Thmanyah Serif', serif;
  box-shadow: inset 0 -6px 14px rgba(0,0,0,.15);
}
.card .info { flex: 1; min-width: 0; }
.card h3 { font-size: 16.5px; line-height: 1.45; margin-bottom: 3px; overflow-wrap: anywhere; word-break: break-word; }
.card .fname { font-size: 12.5px; color: var(--ink); opacity: .75; overflow-wrap: anywhere; word-break: break-word; line-height: 1.5; margin-bottom: 2px; max-width: 100%; }
.card .fsize { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.card .audiolabel { background: var(--brand); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
.card .author { font-size: 12.5px; color: var(--muted); margin-bottom: 9px; }
.tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 7px; }
.tag.ext { background: var(--tag-bg); color: var(--tag-ink); }
.tag.size { background: #efe9d9; color: #7c6c46; }
.dl {
  margin-top: 10px; border: 0; cursor: pointer; font-family: inherit;
  background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 700;
  padding: 9px 22px; border-radius: 11px; display: inline-flex; align-items: center; gap: 6px;
}
.dl.link { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
.fav { background: none; border: 0; cursor: pointer; font-size: 20px; color: var(--gold); padding: 2px 6px; }

.stats {
  margin: 18px 14px; background: #ece5d3; border-radius: 18px;
  display: flex; justify-content: space-around; padding: 16px 8px; text-align: center;
}
.stats b { display: block; font-size: 19px; color: var(--brand); }
.stats span { font-size: 12px; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 44px 20px; font-size: 14.5px; line-height: 2; }
.empty .big { font-size: 42px; display: block; margin-bottom: 8px; }
.sug { margin-top: 14px; }
.sug .sug-lbl { color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
.sug button { display: block; width: 100%; margin: 6px 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--gold, #c9a227); background: transparent; color: var(--fg); font-size: 14px; cursor: pointer; text-align: right; font-family: inherit; }
.sug button:active { opacity: .7; }
.more-btn { display: block; width: calc(100% - 32px); margin: 10px 16px 18px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--brand); background: var(--brand); color: #fff; font-size: 14.5px; font-family: inherit; cursor: pointer; }
.more-btn:disabled { opacity: .6; }

/* ---------- bottom nav ---------- */
.nav {
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
}
.nav button {
  background: none; border: 0; cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11.5px; color: var(--muted); padding: 2px 10px;
}
.nav button .ic { font-size: 19px; }
.nav button.on { color: var(--brand); font-weight: 700; }

/* ---------- admin ---------- */
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  margin: 14px; padding: 18px;
}
.panel h2 { font-size: 18px; color: var(--brand); margin-bottom: 12px; }
.panel .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.8; }
.row { display: flex; gap: 8px; }
.row input, .row select {
  flex: 1; border: 1px solid var(--line); background: #fbf7ec; border-radius: 12px;
  padding: 11px 14px; font-family: inherit; font-size: 14px; outline: 0; color: var(--ink);
}
.btn {
  background: var(--brand); color: #fff; border: 0; border-radius: 12px;
  padding: 11px 18px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn.big { width: 100%; padding: 15px; font-size: 16px; border-radius: 16px; margin-top: 14px;
  box-shadow: 0 8px 20px rgba(19, 29, 56, .35); }
.ch-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 2px; border-bottom: 1px dashed var(--line); font-size: 14px;
}
.ch-row:last-child { border-bottom: 0; }
.ch-row .who { direction: ltr; font-weight: 500; }
.ch-row .cnt { font-size: 12px; color: var(--muted); }
.ch-row .x { background: none; border: 0; color: #b3443f; font-size: 17px; cursor: pointer; padding: 2px 8px; }
.switch { position: relative; width: 46px; height: 27px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .sl { position: absolute; inset: 0; background: #ddd3bd; border-radius: 999px; transition: .2s; cursor: pointer; }
.switch .sl::after { content: ''; position: absolute; top: 3px; right: 3px; width: 21px; height: 21px;
  background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .sl { background: var(--brand); }
.switch input:checked + .sl::after { transform: translateX(-19px); }
.set-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 2px;
  border-bottom: 1px dashed var(--line); font-size: 14.5px; }
.set-row:last-child { border-bottom: 0; }
.set-row input[type=number] { width: 64px; border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 10px; font-family: inherit; font-size: 14px; background: #fbf7ec; text-align: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
.dot.g { background: #3d9b4f; } .dot.r { background: #c0453e; }
.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 999px;
  font-size: 13.5px; z-index: 50; opacity: 0; transition: .25s; pointer-events: none;
}
.toast.show { opacity: 1; }
.spin { text-align: center; padding: 30px; color: var(--muted); font-size: 13.5px; }
.admin-hero { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
  border-radius: 0 0 28px 28px; padding: 22px 20px 26px; color: #fff; }
.admin-hero h1 { font-size: 23px; }
.admin-hero .sub { font-size: 13px; opacity: .85; margin-top: 5px; }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://islamic-library-bot.moharjb2.workers.dev'; // replaced at deploy or left for same-origin
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#1d2a4d'); tg.setBackgroundColor('#f4eee1'); }
const initData = (tg && tg.initData) ? tg.initData : (new URLSearchParams(location.search).get('init') || '');

const state = {
  tab: 'search', q: '', ext: 'all', items: [], hasMore: false, counts: null,
  stats: { files: 0, channels: 0 }, me: null, favs: {}, loading: false,
  admin: null, isAdminView: false,
};
const params = new URLSearchParams(location.search);
state.isAdminView = params.get('admin') === '1';

const EXT_LABELS = { all: 'الكل', pdf: 'PDF', epub: 'EPUB', docx: 'Word', audio: 'صوتي' };
const LETTER_COLORS = ['#1d2a4d', '#b05c34', '#3f5f4a', '#8a6b1f', '#5b4a6e', '#2f5d6e'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  if (opts.method === 'POST') {
    opts.headers = { 'content-type': 'application/json' };
    opts.body = JSON.stringify({ ...(opts.data || {}), init: initData });
  } else {
    path += sep + 'init=' + encodeURIComponent(initData);
  }
  try {
    const r = await fetch(API + path, opts);
    return await r.json();
  } catch (e) {
    return { error: 'network', message: 'تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مجددًا.' };
  }
}

function tgConfirm(msg) {
  return new Promise(res => {
    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.showConfirm) {
      try { return Telegram.WebApp.showConfirm(msg, ok => res(!!ok)); } catch (e) {}
    }
    let dlg = document.getElementById('cfm');
    if (!dlg) {
      dlg = document.createElement('div');
      dlg.id = 'cfm';
      dlg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999';
      document.body.appendChild(dlg);
    }
    dlg.innerHTML = `<div style="background:#fffdf7;border-radius:14px;padding:18px 20px;max-width:300px;text-align:center">
      <div style="margin-bottom:14px;font-size:14.5px;color:#221f1a">${esc(msg)}</div>
      <button id="cfmYes" class="btn" style="margin-left:8px">تأكيد</button>
      <button id="cfmNo" class="btn" style="background:#8a8171">إلغاء</button></div>`;
    dlg.style.display = 'flex';
    dlg.querySelector('#cfmYes').onclick = () => { dlg.style.display = 'none'; res(true); };
    dlg.querySelector('#cfmNo').onclick = () => { dlg.style.display = 'none'; res(false); };
  });
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.lbl = btn.textContent; btn.disabled = true; btn.textContent = label || 'جارٍ...'; btn.style.opacity = .6; }
  else { btn.disabled = false; btn.textContent = btn.dataset.lbl || btn.textContent; btn.style.opacity = 1; }
}

function letterFor(title) {
  const t = (title || '؟').trim();
  return t[0] || '؟';
}
function colorFor(title) {
  let h = 0; for (const c of (title || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return LETTER_COLORS[h % LETTER_COLORS.length];
}

function cardHtml(f) {
  const isFav = !!state.favs[f.id];
  const btn = f.deliverable
    ? `<button class="dl" onclick="download(${f.id}, true)">⬇ تحميل</button>`
    : `<button class="dl link" onclick="download(${f.id}, false)">🔗 فتح في القناة</button>`;
  return `<div class="card">
    <button class="fav" onclick="toggleFav(${f.id})">${isFav ? '★' : '☆'}</button>
    <div class="info">
      <h3>${esc(f.title)}</h3>
      ${f.channel ? `<div class="fname">@${esc(f.channel)}</div>` : ''}
      <div class="fsize">${esc(f.size)}${f.is_audio ? ' <span class="audiolabel">🎧 صوتي</span>' : ''}</div>
      ${f.author ? `<div class="author">${esc(f.author)}</div>` : ''}
      <div class="tags">
        <span class="tag ext">${esc((f.ext || 'ملف').toUpperCase())}</span>
        <span class="tag size">${esc(f.size)}</span>
      </div>
      ${btn}
    </div>
    <div class="letter" style="background:${colorFor(f.title)}">${esc(letterFor(f.title))}</div>
  </div>`;
}

window.download = function(id, direct) {
  const f = state.items.find(x => x.id === id) || (state.adminItems || []).find(x => x.id === id);
  if (direct) {
    const url = `https://t.me/${'ISLAMIC_BOOKS_LIBbot'}?start=dl_${id}`;
    if (tg) tg.openTelegramLink(url); else window.open(url, '_blank');
    toast('سيصلك الملف في المحادثة مع البوت');
    saveHistory(id);
  } else if (f && f.link) {
    if (tg) tg.openTelegramLink(f.link); else window.open(f.link, '_blank');
  }
};

function saveHistory(id) {
  try {
    const h = JSON.parse(localStorage.getItem('dl_history') || '[]');
    h.unshift({ id, at: Date.now() });
    localStorage.setItem('dl_history', JSON.stringify(h.slice(0, 60)));
  } catch (e) {}
}

window.toggleFav = async function(id) {
  const on = !state.favs[id];
  state.favs[id] = on;
  render();
  await api('/api/fav', { method: 'POST', data: { file_id: id, on } });
  toast(on ? 'أضيف إلى المفضلة' : 'أزيل من المفضلة');
};

window.setExt = function(ext) { state.ext = ext; doSearch(); };
window.setTab = function(tab) {
  state.tab = tab;
  if (tab === 'favs') loadFavs();
  else if (tab === 'dl') renderHistory();
  else render();
};
window.onSearchInput = function(v) { state.q = v; };
window.pickSug = function(i) {
  const t = (state.suggestions || [])[i];
  if (!t) return;
  state.q = t.title;
  const inp = document.querySelector('.searchbar input');
  if (inp) inp.value = t;
  doSearch();
};

async function loadMore() {
  if (state.loadingMore || !state.hasMore) return;
  state.loadingMore = true;
  const btn = document.getElementById('moreBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التحميل...'; }
  const r = await api(`/api/search?q=${encodeURIComponent(state.q)}&ext=${state.ext}&off=${state.items.length}`);
  state.loadingMore = false;
  if (r.error) { if (btn) { btn.disabled = false; btn.textContent = 'عرض المزيد ⬇'; } return toast(r.message || 'تعذّر التحميل'); }
  state.items = state.items.concat(r.items || []);
  state.hasMore = r.hasMore;
  if (document.getElementById('results')) updateSearchResults(); else render();
}

async function doSearch() {
  const q = state.q;
  state.loading = true;
  if (document.getElementById('results')) updateSearchResults(); else render();
  const r = await api(`/api/search?q=${encodeURIComponent(q)}&ext=${state.ext}`);
  if (q !== state.q) return;
  state.items = r.items || []; state.hasMore = r.hasMore; state.counts = r.counts || null; state.suggestions = r.suggestions || null; state.external = r.external || null;
  state.loading = false;
  if (document.getElementById('results')) updateSearchResults(); else render();
}
async function loadLatest() {
  const r = await api('/api/latest');
  state.items = r.items || []; state.hasMore = r.hasMore; state.counts = null; state.suggestions = null; state.external = null; render();
}
async function loadFavs() {
  const r = await api('/api/favs');
  state.items = r.items || []; state.counts = null; state.hasMore = false; state.suggestions = null; state.external = null;
  (r.items || []).forEach(f => state.favs[f.id] = true);
  render();
}
function renderHistory() {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('dl_history') || '[]'); } catch (e) {}
  const app = document.getElementById('app');
  app.innerHTML = headerHtml('تحميلاتي', 'الملفات التي حمّلتها مؤخرًا من المكتبة') +
    (h.length ? `<div class="list">${h.map(x => `<div class="card"><div class="info"><h3>ملف #${x.id}</h3>
      <div class="author">${new Date(x.at).toLocaleDateString('ar-EG')}</div>
      <button class="dl" onclick="download(${x.id}, true)">⬇ إعادة التحميل</button></div>
      <div class="letter" style="background:var(--brand)">↓</div></div>`).join('')}</div>`
    : `<div class="empty"><span class="big">⬇</span>لا تحميلات بعد.<br>حمّل أي كتاب وسيظهر هنا.</div>`) + navHtml();
}

function headerHtml(title, sub) {
  return `<div class="hero"><div class="top"><span>مكتبة الكتب</span><span>···</span></div>
    <h1>${esc(title)}</h1><div class="sub" id="hsub">${esc(sub)}</div></div>`;
}

function navHtml() {
  const t = state.tab;
  const adminBtn = state.me && state.me.is_admin
    ? `<button onclick="goAdmin()"><span class="ic">🛠</span>التحكم</button>` : '';
  return `<div class="nav">
    <button class="${t === 'settings' ? 'on' : ''}" onclick="setTab('settings')"><span class="ic">⚙️</span>الإعدادات</button>
    <button class="${t === 'dl' ? 'on' : ''}" onclick="setTab('dl')"><span class="ic">⬇</span>تحميلاتي</button>
    <button class="${t === 'favs' ? 'on' : ''}" onclick="setTab('favs')"><span class="ic">☆</span>المفضلة</button>
    ${adminBtn}
    <button class="${t === 'search' ? 'on' : ''}" onclick="setTab('search')"><span class="ic">🔍</span>البحث</button>
  </div>`;
}
window.goAdmin = function() { state.isAdminView = true; loadAdmin(); };

function chipsHtml() {
  const counts = state.counts;
  return `<div class="chips">` + Object.keys(EXT_LABELS).map(k => {
    const n = counts && counts[k] !== undefined ? ` ${counts[k]}` : '';
    return `<button class="chip ${state.ext === k ? 'on' : ''}" onclick="setExt('${k}')">${EXT_LABELS[k]}${n}</button>`;
  }).join('') + `</div>`;
}

function extLinksHtml(q) {
  const e = encodeURIComponent(q);
  const links = [
    ['📚 الشاملة', 'https://shamela.ws/search?q=' + e],
    ['🕌 الوقفية', 'https://waqfeya.net/search?q=' + e],
    ['📿 الدرر السنية', 'https://dorar.net/site/search?skeys=' + e],
    ['🌐 إسلام هاوس', 'https://islamhouse.com/ar/search/?q=' + e],
  ];
  return `<div class="sug"><div class="sug-lbl">🔗 بحث خارجي (مكتبات سنّية موثوقة):</div>`
    + links.map(([t, u]) => `<button onclick="openExtLib('${u}')">${t}</button>`).join('') + `</div>`;
}
window.openExtLib = function(u) { if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); };

// External books render as the same card shape as channel books.
const EXT_SRC_LABEL = { aj: 'الجامع · aljam3.com', ia: 'archive.org', kb: 'كتاب أونلاين · ketabonline.com' };
function extCardHtml(e2) {
  const size = e2.sizeMb ? e2.sizeMb + ' MB' : '';
  const url = String(e2.url).replace(/'/g, '%27');
  return `<div class="card">
    <div class="info">
      <h3>${esc(e2.title)}</h3>
      <div class="fname">${esc(EXT_SRC_LABEL[e2.src] || e2.src)}</div>
      ${size ? `<div class="fsize">${esc(size)}</div>` : ''}
      <div class="tags">
        <span class="tag ext">${esc(e2.kind || 'رابط')}</span>
        ${size ? `<span class="tag size">${esc(size)}</span>` : ''}
      </div>
      <button class="dl" onclick="openExtLib('${url}')">⬇ تحميل</button>
    </div>
    <div class="letter" style="background:${colorFor(e2.title)}">${esc(letterFor(e2.title))}</div>
  </div>`;
}
function extSectionsHtml() {
  const ext = state.external || [];
  if (!ext.length) return '';
  let h = '';
  if (ext.some(e2 => e2.src === 'aj'))
    h += `<div class="sec-head"><h2>📘 من الجامع aljam3.com</h2></div><div class="list">`
      + ext.filter(e2 => e2.src === 'aj').map(extCardHtml).join('') + `</div>`;
  if (ext.some(e2 => e2.src === 'ia'))
    h += `<div class="sec-head"><h2>🌐 من archive.org</h2></div><div class="list">`
      + ext.filter(e2 => e2.src === 'ia').map(extCardHtml).join('') + `</div>`;
  if (ext.some(e2 => e2.src === 'kb'))
    h += `<div class="sec-head"><h2>📗 من كتاب أونلاين</h2></div><div class="list">`
      + ext.filter(e2 => e2.src === 'kb').map(extCardHtml).join('') + `</div>`;
  return h;
}

function resultsHtml() {
  if (state.loading) return `<div class="spin">جارٍ البحث...</div>`;
  if (!state.items.length) {
    if (!state.q) {
      return `<div class="empty"><span class="big">📚</span>المكتبة قيد الفهرسة.<br>ستظهر الكتب هنا فور إضافتها.</div>`;
    }
    const sugHtml = (state.suggestions && state.suggestions.length)
      ? `<div class="sug"><div class="sug-lbl">هل تقصد:</div>
        ${state.suggestions.map((g, i) => `<button onclick="pickSug(${i})">🔎 ${g.title.replace(/</g, '&lt;')}</button>`).join('')}
        </div>`
      : '<br>جرّب اسمًا أقصر أو جزءًا منه.';
    return `<div class="empty"><span class="big">📚</span>لا توجد نتائج مطابقة.` + sugHtml + extSectionsHtml() + extLinksHtml(state.q) + `</div>`;
  }
  const head = state.q ? `<div class="sec-head"><h2>نتائج البحث</h2></div>`
    : (state.tab === 'search' ? `<div class="sec-head"><h2>أحدث الإضافات</h2></div>` : '');
  let h = head + `<div class="list">${state.items.map(cardHtml).join('')}</div>`;
  if (state.hasMore) h += `<button class="more-btn" id="moreBtn" onclick="loadMore()">${state.loadingMore ? 'جارٍ التحميل...' : 'عرض المزيد ⬇ (' + (state.items.length) + ' معروضة)'}</button>`;
  // External libraries shown inline under the channel results.
  if (state.q) h += extSectionsHtml();
  return h;
}

function subText() {
  return state.tab === 'favs' ? 'كتبك المحفوظة'
    : (state.q && state.counts ? `وجدنا ${state.counts.all} نتيجة مطابقة لبحثك` : `أكثر من ${state.stats.files.toLocaleString('ar-EG')} ملف جاهز للتحميل`);
}

function updateSearchResults() {
  const res = document.getElementById('results');
  if (!res) { render(); return; }
  res.innerHTML = resultsHtml();
  const chips = document.getElementById('chips');
  if (chips) chips.innerHTML = chipsHtml();
  const sub = document.getElementById('hsub');
  if (sub) sub.textContent = subText();
  const ttl = document.querySelector('.hero h1');
  if (ttl) ttl.textContent = state.q ? 'نتائج البحث' : 'ماذا تريد أن تقرأ اليوم؟';
}

function render() {
  if (state.isAdminView) return;
  const app = document.getElementById('app');
  if (state.tab === 'settings') return renderSettings();
  if (state.tab === 'dl') return renderHistory();

  const title = state.tab === 'favs' ? 'المفضلة' : (state.q ? 'نتائج البحث' : 'ماذا تريد أن تقرأ اليوم؟');
  const sub = state.tab === 'favs' ? 'كتبك المحفوظة'
    : (state.q && state.counts ? `وجدنا ${state.counts.all} نتيجة مطابقة لبحثك` : `أكثر من ${state.stats.files.toLocaleString('ar-EG')} ملف جاهز للتحميل`);

  let body = '';
  if (state.tab === 'search') {
    body += `<div class="searchbar">
      <input id="q" placeholder="ابحث باسم الكتاب أو المؤلف..." value="${esc(state.q)}" enterkeyhint="search"
        oninput="state.q=this.value"
        onkeydown="if(event.key==='Enter'){event.preventDefault();doSearch();}">
      <button class="go" onclick="doSearch()">بحث</button>
    </div><div id="chips">` + chipsHtml() + `</div>`;
  }
  body += `<div id="results">` + resultsHtml() + `</div>`;
  if (state.tab === 'search' && !state.q) {
    body += `<div class="stats">
      <div><b>24/7</b><span>متاح دائمًا</span></div>
      <div><b>+${state.stats.files.toLocaleString('ar-EG')}</b><span>ملف جاهز للتحميل</span></div>
    </div>`;
  }
  app.innerHTML = headerHtml(title, sub) + body + navHtml();
}

function renderSettings() {
  const app = document.getElementById('app');
  app.innerHTML = headerHtml('الإعدادات', 'تجربتك في المكتبة') + `
    <div class="panel"><h2>حول المكتبة</h2>
      <div class="hint">المكتبة الإسلامية الشاملة — ابحث باسم الكتاب أو المؤلف ويصلك الملف فورًا.
      يمكنك أيضًا إعادة توجيه أي ملف إلى البوت ليُضاف إلى المكتبة.</div>

window.openChannel = function() { const u = 'https://t.me/cr_wrr'; tg ? tg.openTelegramLink(u) : window.open(u, '_blank'); };
window.openBot = function() { const u = 'https://t.me/ISLAMIC_BOOKS_LIBbot'; tg ? tg.openTelegramLink(u) : window.open(u, '_blank'); };

/* ================= admin ================= */
async function loadAdmin() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="admin-hero"><h1>لوحة التحكم</h1><div class="sub">إدارة المصادر والإعدادات · للمشرف فقط</div></div><div class="spin">جارٍ التحميل...</div>`;
  const r = await api('/api/admin/overview');
  if (r.error) { app.innerHTML = `<div class="empty"><span class="big">⚠️</span>${esc(r.message || r.error)}</div>`; return; }
  if (r.error) { app.innerHTML = `<div class="empty"><span class="big">🔒</span>هذه المنطقة للمشرف فقط.</div>` + navHtml(); state.isAdminView = false; return; }
  state.admin = r;
  // Load the secondary panels in parallel: sequential round trips made the
  // panel take several seconds on mobile.
  const jobs = [api('/api/admin/searches?limit=60'), api('/api/admin/users')];
  if (state.me && state.me.is_owner) jobs.push(api('/api/admin/admins'));
  const [sr, ur, a] = await Promise.all(jobs);
  state.admin.searches = (sr && sr.searches) || [];
  state.admin.usersList = (ur && ur.users) || [];
  if (a && !a.error) {
    state.admin.admins = a.admins || [];
    state.admin.owner_id = a.owner_id || '';
  }
  renderAdmin();
}

  ${state.me && state.me.is_owner ? `<div class="panel"><h2>👑 إدارة المشرفين</h2>

window.addChannel = async function() {
  const v = document.getElementById('newCh').value.trim();
  if (!v) return toast('اكتب رابط القناة أولًا');
  const b = event && event.target; busy(b, true, 'جارٍ الإضافة...');
  const member = document.getElementById('newChMember').checked;
  const r = await api('/api/admin/channel', { method: 'POST', data: { username: v, action: 'add', bot_member: member } });
  busy(b, false);
  if (r.error) return toast(r.message || 'رابط غير صالح');
  toast('أضيف المصدر وستبدأ فهرسته'); loadAdmin();
};
window.rmChannel = async function(u) {
  if (!(await tgConfirm('حذف المصدر @' + u + ' من الفهرسة؟'))) return;
  const r = await api('/api/admin/channel', { method: 'POST', data: { username: u, action: 'remove' } });
  if (r.error) return toast(r.message || 'تعذّر الحذف');
  toast('حُذف المصدر'); loadAdmin();
};
window.toggleChannel = async function(u, on) {
  const r = await api('/api/admin/channel-toggle', { method: 'POST', data: { username: u, active: on } });
  if (r.error) return toast(r.message || 'تعذّر التحديث');
  toast(on ? 'فُعّل المصدر' : 'عُطّل المصدر'); loadAdmin();
};
window.addForced = async function() {
  const v = document.getElementById('newForced').value.trim();
  if (!v) return toast('اكتب اسم القناة');
  const b = event && event.target; busy(b, true);
  const r = await api('/api/admin/forced', { method: 'POST', data: { username: v, action: 'add' } });
  busy(b, false);
  if (r.error) return toast(r.message || 'تعذّرت الإضافة');
  toast('أضيفت قناة الاشتراك الإجباري'); loadAdmin();
};
window.rmForced = async function(u) {
  const r = await api('/api/admin/forced', { method: 'POST', data: { username: u, action: 'remove' } });
  if (r.error) return toast(r.message || 'تعذّر الحذف');
  toast('أزيلت القناة'); loadAdmin();
};
window.toggleForced = async function(u, on) {
  const r = await api('/api/admin/forced-toggle', { method: 'POST', data: { username: u, active: on } });
  if (r.error) return toast(r.message || 'تعذّر التحديث');
  toast(on ? 'فُعّل الاشتراك' : 'عُطّل الاشتراك');
};
window.saveSettings = async function() {
  const b = event && event.target; busy(b, true, 'جارٍ الحفظ...');
  const r = await api('/api/admin/settings', { method: 'POST', data: {
    welcome_on: document.getElementById('sWelcome').checked ? '1' : '0',
    per_page: document.getElementById('sPerPage').value || '10',

  if (r.error) return toast(r.message || 'تعذّر الحفظ');

window.addAdmin = async function() {
  const v = document.getElementById('newAdmin').value.trim();
  if (!v) return toast('اكتب رقم الحساب أو اسم المستخدم');
  const b = event && event.target; busy(b, true);
  const r = await api('/api/admin/admin', { method: 'POST', data: { user: v, action: 'add' } });
  busy(b, false);
  if (r.error) return toast(r.message || 'تعذرت الإضافة');
  toast('أضيف المشرف'); loadAdmin();
};
window.rmAdmin = async function(uid) {
  if (!(await tgConfirm('إزالة هذا المشرف؟'))) return;
  const r = await api('/api/admin/admin', { method: 'POST', data: { user: String(uid), action: 'remove' } });
  if (r.error) return toast(r.message || 'تعذّرت الإزالة');
  toast('أزيل المشرف'); loadAdmin();
};
window.bcPreview = async function() {
  const b = event && event.target; busy(b, true);
  const r = await api('/api/admin/broadcast', { method: 'POST', data: { action: 'preview' } });
  busy(b, false);
  document.getElementById('bcInfo').textContent = r.users !== undefined ? `سيصل إلى ${r.users.toLocaleString('ar-EG')} مستخدم` : (r.message || 'تعذر الجلب');
};
window.bcSend = async function() {
  const t = document.getElementById('bcText').value.trim();
  if (!t) return toast('اكتب الرسالة أولًا');
  const b = event && event.target; busy(b, true, 'جارٍ الإرسال...');
  const p = await api('/api/admin/broadcast', { method: 'POST', data: { action: 'preview' } });
  if (p.error) { busy(b, false); return toast(p.message || 'تعذر الإرسال'); }
  if (!(await tgConfirm(`إرسال إلى ${p.users || 0} مستخدم؟`))) { busy(b, false); return; }
  const r = await api('/api/admin/broadcast', { method: 'POST', data: { action: 'send', text: t } });
  busy(b, false);
  if (r.error) return toast(r.message || 'تعذر الإرسال');
  document.getElementById('bcText').value = '';
  toast('بدأ الإرسال على دفعات');
  bcLoadList();
};
window.exitAdmin = function() { state.isAdminView = false; state.tab = 'search'; render(); };

/* ================= boot ================= */
(async function boot() {
  try {
    const [stats, me] = await Promise.all([api('/api/stats'), api('/api/me')]);
    state.stats = stats; state.me = me;
  } catch (e) {}
  if (state.isAdminView) {
    if (state.me && state.me.is_admin) return loadAdmin();
    state.isAdminView = false;
  }
  render();
  loadLatest();
})();
</script>
