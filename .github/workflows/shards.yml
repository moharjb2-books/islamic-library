          frm: 14001
          to: 21000
        - channel: golden_islamic_library_10_1987
          frm: 21001
          to: 28000
        - channel: golden_islamic_library_10_1987
          frm: 28001
          to: 29925
        - channel: storytelchat
          frm: 1
          to: 7000
        - channel: storytelchat
          frm: 7001
          to: 14000
        - channel: storytelchat
          frm: 14001
          to: 21000
        - channel: storytelchat
          frm: 21001
          to: 23498
        - channel: ilim_hizmeti
          frm: 1
          to: 7000
        - channel: ilim_hizmeti
          frm: 7001
