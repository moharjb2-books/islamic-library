          to: 119000
        - channel: cr_wrr1
          frm: 119001
          to: 126000
        - channel: cr_wrr1
          frm: 126001
          to: 133000
        - channel: cr_wrr1
          frm: 133001
          to: 140000
        - channel: cr_wrr1
