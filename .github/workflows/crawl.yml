name: Index library channels

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Only this channel username (empty = all)"
        required: false
        default: ""
      backfill:
        description: "Backfill mode (1 = scan from/to range)"
        required: false
        default: "0"
      from_id:
        description: "First message id (backfill)"
        required: false
        default: "0"
      to_id:
        description: "Last message id (backfill, 0 = latest)"
        required: false
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          MAX_PAGES: "25"
          DELAY: "1.5"
          CHANNEL_ONLY: ${{ inputs.channel }}
          BACKFILL: ${{ inputs.backfill }}
          EMBED_FROM: ${{ inputs.from_id }}
          EMBED_TO: ${{ inputs.to_id }}
        run: python crawler/crawl.py
